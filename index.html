    font-weight: 400;
    letter-spacing: 0.01em;
    margin: 0;

  .label {

    text-transform: uppercase;
    color: var(--blueprint-light);
    font-weight: 700;

  /* ---------- LOGIN SCREEN ---------- */
  .login-wrap {

    display: flex;
    align-items: center;
    justify-content: center;
  }

  .login-card {
    background: #fffdf8;
    border: 1px solid var(--ink);
    border-radius: var(--radius);
    box-shadow: 6px 6px 0 rgba(31,61,92,0.15);
    width: 100%;
    max-width: 380px;
    padding: 36px 32px;
    position: relative;
  }

  .login-card::before {
    content: "";
    position: absolute;
    top: 10px; left: 10px; right: 10px; bottom: 10px;
    border: 1px dashed var(--paper-line);
    pointer-events: none;
  }

  .login-card .label { display: block; margin-bottom: 6px; }
  .login-card h1 { font-size: 26px; margin-bottom: 4px; }
  .login-card .sub { color: var(--ink-soft); font-size: 13px; margin-bottom: 28px; }

  .field { margin-bottom: 18px; }
  .field label {
    display: block;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 15px;
    border: 1px solid var(--ink);
    border-radius: var(--radius);
    background: #fff;
    color: var(--ink);
  }
  .field input:focus {
    outline: 2px solid var(--blueprint);
    outline-offset: 1px;
  }

  .btn {
    display: inline-block;
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 700;
    padding: 11px 22px;
    border: 1px solid var(--ink);
    border-radius: var(--radius);
    background: var(--blueprint);
    color: #fff;
    cursor: pointer;
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }
  .btn:hover { background: var(--blueprint-light); }
  .btn:active { transform: translateY(1px); }
  .btn.full { width: 100%; text-align: center; }
  .btn.ghost {
    background: transparent;
    color: var(--ink);
  }
  .btn.ghost:hover { background: rgba(0,0,0,0.04); }
  .btn.brass { background: var(--brass); }
  .btn.brass:hover { background: var(--brass-light); }
  .btn.danger { background: var(--err); }
  .btn:disabled { opacity: 0.5; cursor: default; }

  .error-msg {
    background: #fbeaea;
    border: 1px solid var(--err);
    color: var(--err);
    font-size: 13px;
    padding: 9px 12px;
    border-radius: var(--radius);
    margin-bottom: 16px;
  }

  .admin-link {
    text-align: center;
    margin-top: 22px;
    font-size: 11px;
  }
  .admin-link a { color: var(--ink-soft); text-decoration: none; border-bottom: 1px dotted var(--ink-soft); }
  .admin-link a:hover { color: var(--blueprint); }

  /* ---------- HEADER (one-pager + sub pages) ---------- */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 28px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--ink);
  }
  .topbar .crumbs {
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.04em;
  }
  .topbar .crumbs a { color: var(--blueprint); text-decoration: none; cursor: pointer; }
  .topbar .crumbs a:hover { text-decoration: underline; }
  .topbar .session {
    font-size: 11px;
    color: var(--ink-soft);
    text-align: right;
  }

  .hero {
    display: grid;
    grid-template-columns: 1fr 140px;
    gap: 24px;
    margin-bottom: 36px;
    align-items: start;
  }
  .hero-photo {
    width: 140px;
    height: 140px;
    overflow: hidden;
    border: 1px solid var(--ink);
    border-radius: var(--radius);
    background: #fff;
  }
  .hero-photo img { width: 100%; height: 100%; object-fit: cover; object-position: top center; }

  .hero h1 { font-size: 38px; line-height: 1.05; color: var(--ink); }
  .hero .role { color: var(--blueprint); font-size: 16px; margin-top: 4px; font-family: Georgia, serif; }
  .hero .contact {
    margin-top: 16px;
    font-size: 12.5px;
    color: var(--ink-soft);
    line-height: 1.7;
  }
  .hero .contact span { margin-right: 14px; white-space: nowrap; }

  .profile-text {
    font-family: Georgia, serif;
    font-size: 15px;
    line-height: 1.65;
    color: var(--ink);
    border-left: 2px solid var(--brass);
    padding-left: 16px;
    margin-bottom: 36px;
    max-width: 640px;
  }

  .section-block { margin-bottom: 34px; }
  .section-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 14px;
  }
  .section-head .num { color: var(--brass); font-size: 12px; font-weight: 700; }
  .section-head h2 { font-size: 19px; color: var(--ink); }
  .section-head .rule { flex: 1; height: 1px; background: var(--paper-line); }

  .timeline-compact { display: flex; flex-direction: column; gap: 10px; }
  .timeline-row {
    display: grid;
    grid-template-columns: 110px 1fr;
    gap: 14px;
    font-size: 13.5px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--paper-line);
  }
  .timeline-row:last-child { border-bottom: none; }
  .timeline-row .when { color: var(--blueprint); font-size: 11.5px; padding-top: 2px; }
  .timeline-row .what b { font-family: Georgia, serif; font-size: 14.5px; }
  .timeline-row .what .org { color: var(--ink-soft); font-size: 12.5px; }

  .tag-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag {

    border-radius: var(--radius);
    padding: 5px 11px;
    font-size: 12px;
    background: #fff;

  .card-grid {

    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px;
    margin-top: 8px;

  .nav-card {
    border: 1px solid var(--ink);
    border-radius: var(--radius);
    background: #fffdf8;
    padding: 18px;
    cursor: pointer;
    transition: box-shadow 0.12s ease, transform 0.12s ease;

  /* ---------- DETAIL ENTRY (rich) ---------- */
  .detail-entry {

  .detail-entry .org { color: var(--ink-soft); font-size: 13px; margin-top: 3px; font-family: Georgia, serif; }

  .photo-gallery {

    font-size: 10px;
    padding: 4px 8px;
    letter-spacing: 0.04em;

    font-size: 10.5px;
    letter-spacing: 0.06em;

  table.simple td { padding: 7px 8px; border-bottom: 1px solid var(--paper-line); vertical-align: top; }

  .icon-btn {

    padding: 14px;
    margin-bottom: 12px;

  .copy-box code {

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 10px 18px; border-radius: var(--radius);
    font-size: 13px; z-index: 50; box-shadow: 0 4px 14px rgba(0,0,0,0.25);

  .small-note { font-size: 11.5px; color: var(--ink-soft); margin-top: 4px; }

  .loading-state { text-align: center; padding: 60px 0; color: var(--ink-soft); font-size: 13px; }

  @media (max-width: 600px) {
    .hero { grid-template-columns: 1fr; }
    .hero-photo { width: 100px; height: 100px; }
    .timeline-row { grid-template-columns: 90px 1fr; }
  }
</style>

const TOPIC_KEY = "cv_content_v2";
const COMPANIES_KEY = "cv_companies_v1";
const ADMIN_PW_KEY = "cv_admin_pw_v1";
const DEFAULT_ADMIN_PW = "admin2026";

// ---------- storage helpers (Firestore) ----------
const FS_COLLECTION = "cv_app";

async function waitForFirebase() {
  let tries = 0;
  while (!window.__fbReady && tries < 100) {
    await new Promise(r => setTimeout(r, 50));
    tries++;
  }
}

async function storageGet(key) {
  await waitForFirebase();
  try {
    const { doc, getDoc, db } = window.__fb;
    const snap = await getDoc(doc(db, FS_COLLECTION, key));
    if (!snap.exists()) return null;
    const data = snap.data();
    return data && typeof data.value === "string" ? data.value : null;
  } catch (e) {
    console.error("storageGet error", e);
    return null;
  }
}
async function storageSet(key, value) {
  await waitForFirebase();
  try {
    const { doc, setDoc, db } = window.__fb;
    await setDoc(doc(db, FS_COLLECTION, key), { value });
    return true;
  } catch (e) {
    console.error("storageSet error", e);
    return false;
  }
}

async function loadContent() {
  const raw = await storageGet(TOPIC_KEY);
  if (!raw) {
    await storageSet(TOPIC_KEY, JSON.stringify(DEFAULT_CONTENT));
    return JSON.parse(JSON.stringify(DEFAULT_CONTENT));
  }
  try { return JSON.parse(raw); } catch (e) { return JSON.parse(JSON.stringify(DEFAULT_CONTENT)); }
}
async function saveContent(content) {
  return storageSet(TOPIC_KEY, JSON.stringify(content));
}

async function loadCompanies() {
  const raw = await storageGet(COMPANIES_KEY);
  if (!raw) return {};
  try { return JSON.parse(raw); } catch (e) { return {}; }
}
async function saveCompanies(companies) {
  return storageSet(COMPANIES_KEY, JSON.stringify(companies));
}

async function loadAdminPw() {
  const raw = await storageGet(ADMIN_PW_KEY);
  if (!raw) {
    await storageSet(ADMIN_PW_KEY, DEFAULT_ADMIN_PW);
    return DEFAULT_ADMIN_PW;
  }
  return raw;
}
async function saveAdminPw(pw) {
  return storageSet(ADMIN_PW_KEY, pw);
}

function genCode(len) {
  const chars = "abcdefghjkmnpqrstuvwxyz23456789";
  let s = "";
  for (let i = 0; i < len; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}
function genPassword() {
  const words = ["fasttube", "presskit", "fuelcell", "porsche24", "blueprint", "torque", "headwind", "machwerk", "leichtbau", "kennlinie"];
  return words[Math.floor(Math.random() * words.length)] + "-" + genCode(4);
}

function fmtDate(ts) {
  if (!ts) return "–";
  const d = new Date(ts);
  return d.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" }) +
         " " + d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
}

function escapeHtml(str) {
  if (str == null) return "";
  return String(str).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[c]);
}

/* ============================================================
   APP STATE & ROUTING
   route examples: {view:'login'} {view:'home', code} {view:'detail', code, page:'experience'}
                   {view:'admin_login'} {view:'admin'}
   ============================================================ */

let STATE = {
  content: null,
  companies: null,
  adminPw: null,
  route: { view: "login" },
  loginError: "",
  adminLoginError: "",
  toast: null,
  isAdminAuthed: false,
};

function setRoute(route) {
  STATE.route = route;
  history.pushState(route, "");
  render();
}

window.addEventListener("popstate", function(e) {
  if (e.state) {
    STATE.route = e.state;
  } else {
    STATE.route = { view: "login" };
  }
  render();
});

function showToast(msg) {
  STATE.toast = msg;
  render();
  setTimeout(() => { STATE.toast = null; render(); }, 2200);
}

async function init() {
  document.getElementById("root").innerHTML = '<div class="loading-state">Lade Inhalte …</div>';
  STATE.content = await loadContent();
  STATE.companies = await loadCompanies();
  STATE.adminPw = await loadAdminPw();
  history.replaceState(STATE.route, "");
  render();
}

/* ============================================================
   RENDER: LOGIN
   ============================================================ */
function renderLogin() {
  return `
  <div class="app">
    <div class="login-wrap">
      <div class="login-card">
        <span class="label">Vertraulich</span>
        <h1>Lebenslauf</h1>
        <div class="sub">Bitte das bereitgestellte Zugangswort eingeben.</div>
        ${STATE.loginError ? `<div class="error-msg">${escapeHtml(STATE.loginError)}</div>` : ""}
        <form id="login-form">
          <div class="field">
            <label for="pw-input">Passwort</label>
            <input id="pw-input" type="text" autocomplete="off" placeholder="z. B. fasttube-7x2k" />
          </div>
          <button type="submit" class="btn full">Zugang öffnen</button>
        </form>
        <div class="admin-link"><a id="goto-admin">Admin-Zugang</a></div>
      </div>
    </div>
  </div>`;
}

function attachLoginHandlers() {
  const form = document.getElementById("login-form");
  if (form) {
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const val = document.getElementById("pw-input").value.trim();
      if (!val) return;
      const match = Object.entries(STATE.companies).find(([code, c]) => c.password === val);
      if (!match) {
        STATE.loginError = "Dieses Passwort ist nicht gültig. Bitte prüfen und erneut versuchen.";
        render();
        return;
      }
      const [code, company] = match;
      if (!company.opened) {
        company.opened = true;
        company.openedAt = Date.now();
        await saveCompanies(STATE.companies);
      }
      STATE.loginError = "";
      setRoute({ view: "home", code });
    });
  }
  const adminLink = document.getElementById("goto-admin");
  if (adminLink) {
    adminLink.addEventListener("click", () => setRoute({ view: "admin_login" }));
  }
}

/* ============================================================
   RENDER: ONEPAGER (home)
   ============================================================ */
function renderHome(code) {
  const c = STATE.content;
  const company = STATE.companies[code];
  const compactExp = c.experience.slice(0, 4);
  const compactEdu = c.education.slice(0, 3);
  const allSkills = c.skillGroups.flatMap(g => g.items).slice(0, 10);

  return `
  <div class="app">
    <div class="topbar">
      <div class="crumbs">Ansicht für <b>${escapeHtml(company ? company.name : "")}</b></div>
      <div class="session">Lebenslauf · ${escapeHtml(c.name)}</div>
    </div>

    <div class="hero">
      <div>
        <h1>${escapeHtml(c.name)}</h1>
        <div class="role">${escapeHtml(c.role)}</div>
        <div class="contact">
          <span>${escapeHtml(c.location)}</span>
          <span>${escapeHtml(c.phone)}</span>
          <span>${escapeHtml(c.email)}</span><br/>
          <span>${escapeHtml(c.linkedin)}</span>
          <span>${escapeHtml(c.birthInfo)}</span>
        </div>
      </div>
      <div class="hero-photo"><img src="data:image/png;base64,${PHOTO_B64}" alt="${escapeHtml(c.name)}"/></div>
    </div>

    <div class="profile-text">${escapeHtml(c.profileText)}</div>

    <div class="section-block">
      <div class="section-head"><span class="num">01</span><h2>Berufserfahrung</h2><span class="rule"></span></div>
      <div class="timeline-compact">
        ${compactExp.map(e => `
          <div class="timeline-row">
            <div class="when">${escapeHtml(e.when)}</div>
            <div class="what"><b>${escapeHtml(e.title)}</b><br/><span class="org">${escapeHtml(e.org)}</span></div>
          </div>`).join("")}
      </div>
    </div>

    <div class="section-block">
      <div class="section-head"><span class="num">02</span><h2>Ausbildung</h2><span class="rule"></span></div>
      <div class="timeline-compact">
        ${compactEdu.map(e => `
          <div class="timeline-row">
            <div class="when">${escapeHtml(e.when)}</div>
            <div class="what"><b>${escapeHtml(e.title)}</b><br/><span class="org">${escapeHtml(e.org)}</span></div>
          </div>`).join("")}
      </div>
    </div>

    <div class="section-block">
      <div class="section-head"><span class="num">03</span><h2>Kernkompetenzen</h2><span class="rule"></span></div>
      <div class="tag-row">
        ${allSkills.map(s => `<span class="tag">${escapeHtml(s)}</span>`).join("")}
      </div>
    </div>

    <div class="section-block">
      <div class="section-head"><span class="num">04</span><h2>Mehr im Detail</h2><span class="rule"></span></div>
      <div class="card-grid">
        <button class="nav-card" data-page="experience"><span class="num">A</span><h3>Berufserfahrung</h3><p>Alle Stationen mit vollständigen Aufgaben und Ergebnissen.</p></button>
        <button class="nav-card" data-page="education"><span class="num">B</span><h3>Ausbildung</h3><p>Studiengänge, Schwerpunkte und Noten im Detail.</p></button>
        <button class="nav-card" data-page="skills"><span class="num">C</span><h3>Skills &amp; Sprachen</h3><p>Software, Zertifikate, Sprachniveaus und mehr.</p></button>
        <button class="nav-card" data-page="projects"><span class="num">D</span><h3>Projekte &amp; Highlights</h3><p>Formula Student und ausgewählte Projektarbeit im Detail.</p></button>
      </div>
    </div>

    <footer class="page-footer">
      <span>Vertraulich – nur für ${escapeHtml(company ? company.name : "")} bestimmt</span>
      <span><a href="#" id="logout-link" style="color:inherit;">Abmelden</a></span>
    </footer>
  </div>`;
}

function attachHomeHandlers(code) {
  document.querySelectorAll(".nav-card").forEach(btn => {
    btn.addEventListener("click", async () => {
      const page = btn.getAttribute("data-page");
      const company = STATE.companies[code];
      if (company) {
        company.pagesVisited = company.pagesVisited || {};
        company.pagesVisited[page] = Date.now();
        await saveCompanies(STATE.companies);
      }
      setRoute({ view: "detail", code, page });
    });
  });
  const logout = document.getElementById("logout-link");
  if (logout) {
    logout.addEventListener("click", (e) => {
      e.preventDefault();
      setRoute({ view: "login" });
    });
  }
}

/* ============================================================
   RENDER: DETAIL PAGES
   ============================================================ */
const PAGE_TITLES = {
  experience: "Berufserfahrung im Detail",
  education: "Ausbildung im Detail",
  skills: "Skills & Sprachen im Detail",
  projects: "Projekte & Highlights"
};

function renderPhotoGallery(photos) {
  if (!photos || photos.length === 0) return "";
  const slots = photos.map((url, i) => {
    if (url) {
      return `<div class="photo-slot"><img src="${escapeHtml(url)}" alt="Foto ${i+1}" loading="lazy"></div>`;
    } else {
      return `<div class="photo-slot placeholder">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21,15 16,10 5,21"/></svg>
        <span>Foto ${i+1}</span>
      </div>`;
    }
  }).join("");
  return `<div class="photo-gallery">${slots}</div>`;
}

function renderDetail(code, page) {
  const c = STATE.content;
  const company = STATE.companies[code];
  let body = "";

  if (page === "experience" || page === "education" || page === "projects") {
    const list = page === "experience" ? c.experience : page === "education" ? c.education : c.projects;
    body = list.map(e => {
      const gallery = renderPhotoGallery(e.photos);
      const story = e.story ? `<div class="detail-story">${escapeHtml(e.story)}</div>` : "";
      const bullets = e.bullets && e.bullets.length
        ? `<ul>${e.bullets.map(b => `<li>${escapeHtml(b)}</li>`).join("")}</ul>`
        : "";
      return `
      <div class="detail-entry">
        <div class="detail-entry-header">
          <div class="when">${escapeHtml(e.when)}</div>
          <h3>${escapeHtml(e.title)}</h3>
          <div class="org">${escapeHtml(e.org)}</div>
        </div>
        ${gallery}
        ${story}
        ${bullets}
      </div>`;
    }).join("") || `<div class="empty-note">Noch keine Einträge vorhanden.</div>`;
  } else if (page === "skills") {
    body = c.skillGroups.map(g => `
      <div class="skill-group">
        <span class="label">${escapeHtml(g.label)}</span>
        <div class="tag-row">${g.items.map(i => `<span class="tag">${escapeHtml(i)}</span>`).join("")}</div>
      </div>`).join("");
  }

  return `
  <div class="app">
    <div class="topbar">
      <div class="crumbs"><a id="back-home">${escapeHtml(c.name)}</a> / ${escapeHtml(PAGE_TITLES[page] || "")}</div>
      <div class="session">Ansicht für ${escapeHtml(company ? company.name : "")}</div>
    </div>
    <h1 style="font-size:26px; margin-bottom:22px;">${escapeHtml(PAGE_TITLES[page] || "")}</h1>
    ${body}
    <footer class="page-footer">
      <span>Vertraulich – nur für ${escapeHtml(company ? company.name : "")} bestimmt</span>
      <span><a href="#" id="logout-link2" style="color:inherit;">Abmelden</a></span>
    </footer>
  </div>`;
}

function attachDetailHandlers(code) {
  const back = document.getElementById("back-home");
  if (back) back.addEventListener("click", () => setRoute({ view: "home", code }));
  const logout = document.getElementById("logout-link2");
  if (logout) logout.addEventListener("click", (e) => { e.preventDefault(); setRoute({ view: "login" }); });
}

/* ============================================================
   RENDER: ADMIN LOGIN
   ============================================================ */
function renderAdminLogin() {
  return `
  <div class="app">
    <div class="login-wrap">
      <div class="login-card">
        <span class="label">Admin</span>
        <h1>Verwaltung</h1>
        <div class="sub">Zugang zum Pflegen von Inhalten und Firmenpasswörtern.</div>
        ${STATE.adminLoginError ? `<div class="error-msg">${escapeHtml(STATE.adminLoginError)}</div>` : ""}
        <form id="admin-login-form">
          <div class="field">
            <label for="admin-pw-input">Admin-Passwort</label>
            <input id="admin-pw-input" type="password" autocomplete="off" />
          </div>
          <button type="submit" class="btn full brass">Anmelden</button>
        </form>
        <div class="admin-link"><a id="back-to-login">Zurück zur Lebenslauf-Ansicht</a></div>
      </div>
    </div>
  </div>`;
}

function attachAdminLoginHandlers() {
  const form = document.getElementById("admin-login-form");
  if (form) {
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const val = document.getElementById("admin-pw-input").value;
      if (val === STATE.adminPw) {
        STATE.isAdminAuthed = true;
        STATE.adminLoginError = "";
        setRoute({ view: "admin" });
      } else {
        STATE.adminLoginError = "Falsches Passwort.";
        render();
      }
    });
  }
  const back = document.getElementById("back-to-login");
  if (back) back.addEventListener("click", () => setRoute({ view: "login" }));
}

/* ============================================================
   RENDER: ADMIN DASHBOARD
   ============================================================ */
function renderAdmin() {
  if (!STATE.isAdminAuthed) return renderAdminLogin();

  const companies = STATE.companies;
  const companyRows = Object.entries(companies)
    .sort((a, b) => b[1].createdAt - a[1].createdAt)
    .map(([code, c]) => {
      const visited = c.pagesVisited ? Object.keys(c.pagesVisited) : [];
      return `
      <tr>
        <td><b>${escapeHtml(c.name)}</b></td>
        <td><code>${escapeHtml(c.password)}</code></td>
        <td>${c.opened ? `<span class="pill opened">Geöffnet ${fmtDate(c.openedAt)}</span>` : `<span class="pill pending">Noch nicht geöffnet</span>`}</td>
        <td>${visited.length ? visited.map(p => PAGE_TITLES[p] ? PAGE_TITLES[p].replace(" im Detail","").replace(" & Highlights"," & Highlights") : p).join(", ") : "–"}</td>
        <td>
          <div class="row-actions">
            <button class="icon-btn" data-action="copy" data-code="${escapeHtml(code)}">Link kopieren</button>
            <button class="icon-btn danger" data-action="delete" data-code="${escapeHtml(code)}">Löschen</button>
          </div>
        </td>
      </tr>`;
    }).join("");

  const c = STATE.content;

  return `
  <div class="app admin-shell">
    <div class="topbar">
      <div class="crumbs">Admin-Bereich</div>
      <div class="session"><a id="admin-logout" href="#" style="color:inherit;">Abmelden</a></div>
    </div>

    <div class="panel">
      <h2>Neue Bewerbung anlegen</h2>
      <div class="inline-form">
        <input id="new-company-name" type="text" placeholder="Firmenname, z. B. Porsche AG" />
        <button class="btn" id="create-company-btn">Passwort generieren</button>
      </div>
      <div class="small-note">Es wird automatisch ein eindeutiges Passwort erzeugt, das du an die Firma weitergeben kannst.</div>
    </div>

    <div class="panel">
      <h2>Bewerbungen &amp; Tracking</h2>
      ${companyRows ? `
        <table class="simple">
          <thead><tr><th>Firma</th><th>Passwort</th><th>Status</th><th>Aufgerufene Seiten</th><th></th></tr></thead>
          <tbody>${companyRows}</tbody>
        </table>` : `<div class="empty-note">Noch keine Bewerbungen angelegt.</div>`}
    </div>

    <div class="panel">
      <h2>Profil &amp; Kontakt</h2>
      <div class="editor-field"><label>Name</label><input data-field="name" value="${escapeHtml(c.name)}"/></div>
      <div class="editor-field"><label>Rolle / Titel</label><input data-field="role" value="${escapeHtml(c.role)}"/></div>
      <div class="editor-field"><label>Ort</label><input data-field="location" value="${escapeHtml(c.location)}"/></div>
      <div class="editor-field"><label>Telefon</label><input data-field="phone" value="${escapeHtml(c.phone)}"/></div>
      <div class="editor-field"><label>E-Mail</label><input data-field="email" value="${escapeHtml(c.email)}"/></div>
      <div class="editor-field"><label>LinkedIn</label><input data-field="linkedin" value="${escapeHtml(c.linkedin)}"/></div>
      <div class="editor-field"><label>Geburtsdatum-Info</label><input data-field="birthInfo" value="${escapeHtml(c.birthInfo)}"/></div>
      <div class="editor-field"><label>Profiltext</label><textarea class="editor" data-field="profileText">${escapeHtml(c.profileText)}</textarea></div>
      <button class="btn" id="save-profile-btn">Profil speichern</button>
    </div>

    ${renderEntryListEditor("experience", "Berufserfahrung", c.experience)}
    ${renderEntryListEditor("education", "Ausbildung", c.education)}
    ${renderEntryListEditor("projects", "Projekte & Highlights", c.projects)}
    ${renderSkillsEditor(c.skillGroups)}

    <div class="panel">
      <h2>Admin-Passwort ändern</h2>
      <div class="inline-form">
        <input id="new-admin-pw" type="password" placeholder="Neues Admin-Passwort" />
        <button class="btn ghost" id="save-admin-pw-btn">Ändern</button>
      </div>
      <div class="small-note">Gilt sofort für den nächsten Admin-Login.</div>
    </div>

  </div>`;
}

function renderEntryListEditor(key, label, entries) {
  const cards = entries.map((e, i) => `
    <div class="entry-card" data-entry-key="${key}" data-index="${i}">
      <div class="entry-card-head">
        <b>${escapeHtml(e.title) || "(ohne Titel)"}</b>
        <button class="icon-btn danger" data-action="remove-entry" data-key="${key}" data-index="${i}">Entfernen</button>
      </div>
      <div class="editor-field"><label>Zeitraum</label><input data-entry-field="when" data-key="${key}" data-index="${i}" value="${escapeHtml(e.when)}"/></div>
      <div class="editor-field"><label>Titel</label><input data-entry-field="title" data-key="${key}" data-index="${i}" value="${escapeHtml(e.title)}"/></div>
      <div class="editor-field"><label>Organisation / Ort</label><input data-entry-field="org" data-key="${key}" data-index="${i}" value="${escapeHtml(e.org)}"/></div>
      <div class="editor-field"><label>Beschreibung (eine Zeile pro Punkt)</label><textarea class="editor" data-entry-field="bullets" data-key="${key}" data-index="${i}">${escapeHtml((e.bullets || []).join("\n"))}</textarea></div>
    </div>
  `).join("");

  return `
  <div class="panel">
    <h2>${escapeHtml(label)}</h2>
    ${cards || `<div class="empty-note">Noch keine Einträge.</div>`}
    <button class="btn ghost" data-action="add-entry" data-key="${key}">+ Eintrag hinzufügen</button>
    <button class="btn" style="margin-left:8px;" data-action="save-entries" data-key="${key}">Speichern</button>
  </div>`;
}

function renderSkillsEditor(skillGroups) {
  const cards = skillGroups.map((g, i) => `
    <div class="entry-card" data-index="${i}">
      <div class="entry-card-head">
        <b>${escapeHtml(g.label) || "(ohne Bezeichnung)"}</b>
        <button class="icon-btn danger" data-action="remove-skillgroup" data-index="${i}">Entfernen</button>
      </div>
      <div class="editor-field"><label>Bezeichnung</label><input data-skill-field="label" data-index="${i}" value="${escapeHtml(g.label)}"/></div>
      <div class="editor-field"><label>Einträge (durch Komma getrennt)</label><input data-skill-field="items" data-index="${i}" value="${escapeHtml((g.items || []).join(", "))}"/></div>
    </div>
  `).join("");

  return `
  <div class="panel">
    <h2>Skills &amp; Sprachen</h2>
    ${cards}
    <button class="btn ghost" data-action="add-skillgroup">+ Gruppe hinzufügen</button>
    <button class="btn" style="margin-left:8px;" data-action="save-skillgroups">Speichern</button>
  </div>`;
}

function attachAdminHandlers() {
  const logout = document.getElementById("admin-logout");
  if (logout) logout.addEventListener("click", (e) => { e.preventDefault(); STATE.isAdminAuthed = false; setRoute({ view: "login" }); });

  const createBtn = document.getElementById("create-company-btn");
  if (createBtn) {
    createBtn.addEventListener("click", async () => {
      const nameInput = document.getElementById("new-company-name");
      const name = nameInput.value.trim();
      if (!name) { showToast("Bitte einen Firmennamen eingeben."); return; }
      let code;
      do { code = genCode(8); } while (STATE.companies[code]);
      const password = genPassword();
      STATE.companies[code] = { name, password, createdAt: Date.now(), opened: false, openedAt: null, pagesVisited: {} };
      await saveCompanies(STATE.companies);
      nameInput.value = "";
      showToast(`Passwort für ${name} erstellt: ${password}`);
      render();
    });
  }

  document.querySelectorAll('[data-action="copy"]').forEach(btn => {
    btn.addEventListener("click", () => {
      const code = btn.getAttribute("data-code");
      const company = STATE.companies[code];
      const text = `Passwort: ${company.password}`;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => showToast("Passwort kopiert."));
      } else {
        showToast(text);
      }
    });
  });

  document.querySelectorAll('[data-action="delete"]').forEach(btn => {
    btn.addEventListener("click", async () => {
      const code = btn.getAttribute("data-code");
      if (!confirm(`Eintrag für "${STATE.companies[code].name}" wirklich löschen?`)) return;
      delete STATE.companies[code];
      await saveCompanies(STATE.companies);
      render();
    });
  });

  const saveProfileBtn = document.getElementById("save-profile-btn");
  if (saveProfileBtn) {
    saveProfileBtn.addEventListener("click", async () => {
      document.querySelectorAll("[data-field]").forEach(input => {
        const field = input.getAttribute("data-field");
        STATE.content[field] = input.value;
      });
      await saveContent(STATE.content);
      showToast("Profil gespeichert.");
    });
  }

  document.querySelectorAll('[data-action="add-entry"]').forEach(btn => {
    btn.addEventListener("click", () => {
      const key = btn.getAttribute("data-key");
      STATE.content[key].push({ when: "", title: "", org: "", bullets: [] });
      render();
    });
  });

  document.querySelectorAll('[data-action="remove-entry"]').forEach(btn => {
    btn.addEventListener("click", async () => {
      const key = btn.getAttribute("data-key");
      const idx = parseInt(btn.getAttribute("data-index"), 10);
      STATE.content[key].splice(idx, 1);
      await saveContent(STATE.content);
      render();
    });
  });

  document.querySelectorAll('[data-action="save-entries"]').forEach(btn => {
    btn.addEventListener("click", async () => {
      const key = btn.getAttribute("data-key");
      document.querySelectorAll(`[data-entry-field][data-key="${key}"]`).forEach(input => {
        const idx = parseInt(input.getAttribute("data-index"), 10);
        const field = input.getAttribute("data-entry-field");
        if (!STATE.content[key][idx]) return;
        if (field === "bullets") {
          STATE.content[key][idx].bullets = input.value.split("\n").map(s => s.trim()).filter(Boolean);
        } else {
          STATE.content[key][idx][field] = input.value;
        }
      });
      await saveContent(STATE.content);
      showToast("Gespeichert.");
    });
  });

  document.querySelectorAll('[data-action="add-skillgroup"]').forEach(btn => {
    btn.addEventListener("click", () => {
      STATE.content.skillGroups.push({ label: "", items: [] });
      render();
    });
  });
  document.querySelectorAll('[data-action="remove-skillgroup"]').forEach(btn => {
    btn.addEventListener("click", async () => {
      const idx = parseInt(btn.getAttribute("data-index"), 10);
      STATE.content.skillGroups.splice(idx, 1);
      await saveContent(STATE.content);
      render();
    });
  });
  document.querySelectorAll('[data-action="save-skillgroups"]').forEach(btn => {
    btn.addEventListener("click", async () => {
      document.querySelectorAll("[data-skill-field]").forEach(input => {
        const idx = parseInt(input.getAttribute("data-index"), 10);
        const field = input.getAttribute("data-skill-field");
        if (!STATE.content.skillGroups[idx]) return;
        if (field === "items") {
          STATE.content.skillGroups[idx].items = input.value.split(",").map(s => s.trim()).filter(Boolean);
        } else {
          STATE.content.skillGroups[idx][field] = input.value;
        }
      });
      await saveContent(STATE.content);
      showToast("Gespeichert.");
    });
  });

  const saveAdminPwBtn = document.getElementById("save-admin-pw-btn");
  if (saveAdminPwBtn) {
    saveAdminPwBtn.addEventListener("click", async () => {
      const input = document.getElementById("new-admin-pw");
      const val = input.value.trim();
      if (!val) { showToast("Bitte ein neues Passwort eingeben."); return; }
      if (val.length < 6) { showToast("Mindestens 6 Zeichen verwenden."); return; }
      STATE.adminPw = val;
      await saveAdminPw(val);
      input.value = "";
      showToast("Admin-Passwort geändert.");
    });
  }
}

/* ============================================================
   MAIN RENDER DISPATCH
   ============================================================ */
function render() {
  const root = document.getElementById("root");
  const r = STATE.route;
  let html = "";

  if (r.view === "login") html = renderLogin();
  else if (r.view === "home") html = renderHome(r.code);
  else if (r.view === "detail") html = renderDetail(r.code, r.page);
  else if (r.view === "admin_login") html = renderAdminLogin();
  else if (r.view === "admin") html = renderAdmin();

  if (STATE.toast) html += `<div class="toast">${escapeHtml(STATE.toast)}</div>`;

  root.innerHTML = html;

  if (r.view === "login") attachLoginHandlers();
  else if (r.view === "home") attachHomeHandlers(r.code);
  else if (r.view === "detail") attachDetailHandlers(r.code);
  else if (r.view === "admin_login") attachAdminLoginHandlers();
  else if (r.view === "admin") attachAdminHandlers();
}

init();
</script>
</body>
</html>
